# Apache 가상호스트 — aiproject2.duckdns.org 로 들어온 요청만 Streamlit(8003)으로 넘긴다.
#   · 서버의 기존 Apache 사이트(000-default, /var/www/html — 팀원 페이지)는 그대로 둔다.
#     (http://IP/ 로 오는 요청은 기존 사이트, 도메인으로 오는 요청만 이 설정이 받음)
#   · Streamlit 은 웹소켓(/_stcore/stream)을 쓰므로 Upgrade 요청을 ws:// 로 전달한다.
#   · HTTPS(443) 설정과 http→https 이동은 certbot --apache 가 이 파일을 복사해 자동 생성한다.
# 설치: deploy/HTTPS.md 의 "Apache 가 이미 80 을 쓰는 경우" 절 참고.

<VirtualHost *:80>
    ServerName aiproject2.duckdns.org

    ProxyRequests Off
    ProxyPreserveHost On
    # LLM 답변·사진 분석이 수십 초 걸릴 수 있어 넉넉히
    ProxyTimeout 600

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8003/$1 [P,L]

    ProxyPass        / http://127.0.0.1:8003/
    ProxyPassReverse / http://127.0.0.1:8003/

    ErrorLog ${APACHE_LOG_DIR}/aiproject2_error.log
    CustomLog ${APACHE_LOG_DIR}/aiproject2_access.log combined
</VirtualHost>
